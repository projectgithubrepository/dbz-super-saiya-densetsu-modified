name: DBZ sprite-stack Windows build
# Build the playable Windows game and run the sprite-stack renderer tests.
# Revalidation trigger: verify the current sprite-stacking branch head.

on:
  push:
    branches:
      - feature/sprite-stacking-foundation
    paths:
      - "crates/ssd-hd/**"
      - "crates/ssd-app/**"
      - ".github/workflows/sprite-volume-demo.yml"
      - "Cargo.toml"
  workflow_dispatch:

concurrency:
  group: sprite-stack-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-demo:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the playable Windows game
        run: cargo build -p ssd-app --release --bin ssd-recompiled

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: dbz-sprite-stack-windows
          path: target/release/ssd-recompiled.exe
          if-no-files-found: error

      - name: Run sprite-stack tests
        run: cargo test -p ssd-hd
