name: DBZ sprite-stack Windows build
# Build and test the actual live-game sprite-stack renderer.

on:
  push:
    branches:
      - feature/sprite-stacking-foundation
    paths:
      - "crates/ssd-hd/**"
      - ".github/workflows/sprite-volume-demo.yml"
      - "Cargo.toml"
  workflow_dispatch:

concurrency:
  group: sprite-stack-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-demo:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the playable Windows game
        run: cargo build -p ssd-app --release --bin ssd-recompiled

      - name: Build the sprite-volume utility
        run: cargo build -p ssd-hd --bin sprite-volume-demo

      - name: Render sample image
        run: cargo run -p ssd-hd --bin sprite-volume-demo -- sprite-volume-demo.png

      - name: Run sprite-stack tests
        run: cargo test -p ssd-hd

      - name: Upload executable and preview
        uses: actions/upload-artifact@v4
        with:
          name: dbz-sprite-stack-windows
          path: |
            target/release/ssd-recompiled.exe
            target/debug/sprite-volume-demo.exe
            sprite-volume-demo.png
          if-no-files-found: error
