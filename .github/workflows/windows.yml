name: Windows build and tests

on:
  push:
    branches:
      - work/flight-3d-complete
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run HD renderer tests
        run: cargo test -p ssd-hd --release --locked

      - name: Build Windows executable
        run: cargo build -p ssd-app --release --locked

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ssd-recompiled.exe dist/
          Compress-Archive -Path dist/ssd-recompiled.exe -DestinationPath dbz-ssd-windows-x86_64.zip -Force

      - name: Upload Windows executable and archive
        uses: actions/upload-artifact@v4
        with:
          name: dbz-ssd-windows-x86_64
          path: |
            dist/ssd-recompiled.exe
            dbz-ssd-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
