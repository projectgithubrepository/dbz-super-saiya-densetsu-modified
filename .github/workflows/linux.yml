name: Linux build and tests

on:
  push:
    branches:
      - work/flight-3d-complete
    paths:
      - 'crates/**'
      - 'third_party/**'
      - 'assets/**'
      - 'resources/**'
      - 'rom/**'
      - 'data/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

# Several commits in quick succession must not compile the same project in parallel.
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libgl1-mesa-dev libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run HD renderer tests
        run: cargo test -p ssd-hd --release --locked

      - name: Build Linux executable
        run: cargo build -p ssd-app --release --locked

      - name: Package Linux executable
        run: |
          mkdir -p dist
          cp target/release/ssd-recompiled dist/
          tar -czf dbz-ssd-linux-x86_64.tar.gz -C dist ssd-recompiled

      - name: Upload Linux executable and archive
        uses: actions/upload-artifact@v4
        with:
          name: dbz-ssd-linux-x86_64
          path: |
            dist/ssd-recompiled
            dbz-ssd-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
